<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VisualCount</title>
<style>
:root{
  --bg:#f3f5f2;--panel:#fff;--fg:#17201b;--muted:#5d6a62;--line:#d6ddd8;
  --accent:#0f7a4f;--accent-fg:#fff;--in:#16c172;--out:rgba(255,255,255,.35);--removed:#e5484d;--added:#ffb020;--area:#ffd60a;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#101512;--panel:#18201b;--fg:#e6ede8;--muted:#9aa89f;--line:#2b3630;--accent:#3fbf86;--accent-fg:#06140d;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font)}
.wrap{max-width:820px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:grid;gap:14px}
h1{margin:0;font-size:1.35rem;letter-spacing:-.01em}
.muted{color:var(--muted);margin:0}
button,.btn{font:600 1rem var(--font);border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:12px 16px;cursor:pointer;text-align:center}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
#file{display:none}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden}
canvas{display:block;width:100%;touch-action:none}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-weight:600}
.count{display:flex;align-items:baseline;gap:10px}
.count b{font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.hint{font-size:.9rem;color:var(--muted)}
input[type=text]{font:1rem var(--font);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);flex:1;min-width:0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.err{color:var(--removed);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>VisualCount</h1>
    <p class="muted">Take a shelf photo, drag a box over the products you want, then fix any mistakes.</p>
  </div>

  <div class="row">
    <label class="btn primary" for="file" style="flex:1">Take or choose photo</label>
    <input id="file" type="file" accept="image/*" capture="environment">
  </div>
  <p id="msg" class="hint" hidden></p>

  <section id="work" hidden>
    <div class="seg" role="group" aria-label="Mode">
      <button id="modeArea" type="button" aria-pressed="true">1. Draw area</button>
      <button id="modeFix" type="button" aria-pressed="false">2. Fix boxes</button>
    </div>
    <p id="modeHint" class="hint">Drag your finger over the shelf section to count.</p>
    <div class="stage">
      <canvas id="cv"></canvas>
      <div id="busy" class="busy" hidden>Counting products…</div>
    </div>
    <div class="legend">
      <span><i style="background:var(--in)"></i>Counted</span>
      <span><i style="background:var(--removed)"></i>Removed by you</span>
      <span><i style="background:var(--added)"></i>Added by you</span>
      <span><i style="background:var(--area)"></i>Your area</span>
    </div>
    <div class="row" style="justify-content:space-between">
      <div class="count"><b id="count">0</b><span class="hint" id="countNote">products</span></div>
      <button id="resetArea" type="button">Whole photo</button>
    </div>
    <div class="row">
      <input id="product" type="text" placeholder="Product or shelf name (e.g. Oil 5L)">
      <button id="save" type="button" class="primary">Save count</button>
    </div>
  </section>

  <section id="saved" hidden>
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0;font-size:1.1rem">Saved counts</h2>
      <div class="row">
        <button id="export" type="button" class="primary">Export Excel</button>
        <button id="clearAll" type="button">Clear list</button>
      </div>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Time</th><th>Product</th><th class="n">Count</th><th class="n">AI</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let img = null, photoName = "", boxes = [], added = [], area = null, mode = "area", drag = null;
let rows = [];
try { rows = JSON.parse(localStorage.getItem("vc_rows") || "[]"); } catch (e) { rows = []; }

function msg(t, isErr) { const m = $("msg"); m.hidden = !t; m.textContent = t || ""; m.className = isErr ? "hint err" : "hint"; }

$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  photoName = f.name || "photo.jpg";
  msg("");
  const bmp = await loadImage(f);
  img = bmp; boxes = []; added = []; area = null;
  $("work").hidden = false; fit(); draw();
  $("busy").hidden = false;
  try {
    const blob = await shrink(bmp);
    const fd = new FormData(); fd.append("image", blob, "photo.jpg");
    const r = await fetch("/api/detect", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "The computer could not read the photo.");
    const data = await r.json();
    boxes = data.boxes.map(b => ({ ...b, removed: false }));
    setMode("area");
  } catch (err) {
    msg("Couldn't count: " + err.message + " Check that the VisualCount window is still open on your computer.", true);
  } finally { $("busy").hidden = true; draw(); e.target.value = ""; }
});

function loadImage(file) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
}
function shrink(i) {
  const s = Math.min(1, 1600 / Math.max(i.naturalWidth, i.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(i.naturalWidth * s); c.height = Math.round(i.naturalHeight * s);
  c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.88));
}
function fit() {
  if (!img) return;
  const w = cv.parentElement.clientWidth, ratio = img.naturalHeight / img.naturalWidth;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * ratio * dpr);
  cv.style.height = (w * ratio) + "px";
}
window.addEventListener("resize", () => { fit(); draw(); });

const inArea = (x, y) => !area || (x >= area.x0 && x <= area.x1 && y >= area.y0 && y <= area.y1);
const center = b => [(b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2];
function tally() {
  const inside = boxes.filter(b => inArea(...center(b)));
  const ai = inside.length, removed = inside.filter(b => b.removed).length;
  const add = added.filter(p => inArea(p.x, p.y)).length;
  return { ai, removed, add, total: ai - removed + add };
}
function draw() {
  if (!img) return;
  const W = cv.width, H = cv.height, dpr = window.devicePixelRatio || 1;
  ctx.drawImage(img, 0, 0, W, H);
  ctx.lineWidth = 2 * dpr;
  for (const b of boxes) {
    const ins = inArea(...center(b));
    ctx.strokeStyle = b.removed ? "#e5484d" : ins ? "#16c172" : "rgba(255,255,255,.35)";
    ctx.strokeRect(b.x0 * W, b.y0 * H, (b.x1 - b.x0) * W, (b.y1 - b.y0) * H);
    if (b.removed && ins) {
      ctx.beginPath(); ctx.moveTo(b.x0 * W, b.y0 * H); ctx.lineTo(b.x1 * W, b.y1 * H);
      ctx.moveTo(b.x1 * W, b.y0 * H); ctx.lineTo(b.x0 * W, b.y1 * H); ctx.stroke();
    }
  }
  for (const p of added) {
    ctx.fillStyle = "#ffb020"; ctx.strokeStyle = "#000";
    ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 8 * dpr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  const a = drag || area;
  if (a) {
    ctx.strokeStyle = "#ffd60a"; ctx.lineWidth = 3 * dpr; ctx.setLineDash([10 * dpr, 6 * dpr]);
    const x0 = Math.min(a.x0, a.x1), y0 = Math.min(a.y0, a.y1);
    ctx.strokeRect(x0 * W, y0 * H, Math.abs(a.x1 - a.x0) * W, Math.abs(a.y1 - a.y0) * H);
    ctx.setLineDash([]);
  }
  const t = tally();
  $("count").textContent = t.total;
  $("countNote").textContent = `products${area ? " in your area" : " in whole photo"}` + (t.removed || t.add ? ` (AI ${t.ai}, −${t.removed} +${t.add})` : "");
}
function pos(e) { const r = cv.getBoundingClientRect(); return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }; }

cv.addEventListener("pointerdown", e => {
  if (!img) return; const p = pos(e);
  if (mode === "area") { drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; cv.setPointerCapture(e.pointerId); draw(); return; }
  const W = cv.clientWidth, H = cv.clientHeight;
  const hitAdd = added.findIndex(a => Math.hypot((a.x - p.x) * W, (a.y - p.y) * H) < 16);
  if (hitAdd >= 0) { added.splice(hitAdd, 1); draw(); return; }
  // smallest box under the finger
  const hits = boxes.filter(b => p.x >= b.x0 && p.x <= b.x1 && p.y >= b.y0 && p.y <= b.y1)
    .sort((a, b) => (a.x1 - a.x0) * (a.y1 - a.y0) - (b.x1 - b.x0) * (b.y1 - b.y0));
  if (hits.length) hits[0].removed = !hits[0].removed; else added.push(p);
  draw();
});
cv.addEventListener("pointermove", e => { if (drag) { const p = pos(e); drag.x1 = p.x; drag.y1 = p.y; draw(); } });
cv.addEventListener("pointerup", () => {
  if (!drag) return;
  const a = { x0: Math.min(drag.x0, drag.x1), y0: Math.min(drag.y0, drag.y1), x1: Math.max(drag.x0, drag.x1), y1: Math.max(drag.y0, drag.y1) };
  drag = null;
  if ((a.x1 - a.x0) > 0.03 && (a.y1 - a.y0) > 0.03) { area = a; setMode("fix"); }
  draw();
});

function setMode(m) {
  mode = m;
  $("modeArea").setAttribute("aria-pressed", m === "area"); $("modeFix").setAttribute("aria-pressed", m === "fix");
  $("modeHint").textContent = m === "area" ? "Drag your finger over the shelf section to count." : "Tap a wrong box to remove it. Tap a missed product to add it.";
}
$("modeArea").onclick = () => setMode("area");
$("modeFix").onclick = () => setMode("fix");
$("resetArea").onclick = () => { area = null; draw(); };

$("save").onclick = () => {
  if (!img) return;
  const t = tally();
  rows.push({ time: new Date().toLocaleString(), product: $("product").value.trim() || "Unnamed", count: t.total, ai_count: t.ai, added: t.add, removed: t.removed, photo: photoName });
  persist(); renderRows(); $("product").value = ""; msg("Saved. Take the next photo when ready.");
};
function persist() { try { localStorage.setItem("vc_rows", JSON.stringify(rows)); } catch (e) {} }
function renderRows() {
  $("saved").hidden = !rows.length;
  const tb = $("rows"); tb.textContent = "";
  for (const r of rows.slice().reverse()) {
    const tr = document.createElement("tr");
    for (const [v, n] of [[r.time], [r.product], [r.count, 1], [r.ai_count, 1]]) { const td = document.createElement("td"); td.textContent = v; if (n) td.className = "n"; tr.append(td); }
    tb.append(tr);
  }
}
let clearArmed = false;
$("clearAll").onclick = () => {
  if (!clearArmed) { clearArmed = true; $("clearAll").textContent = "Tap again to clear"; setTimeout(() => { clearArmed = false; $("clearAll").textContent = "Clear list"; }, 3000); return; }
  rows = []; persist(); renderRows(); clearArmed = false; $("clearAll").textContent = "Clear list";
};
$("export").onclick = async () => {
  try {
    const r = await fetch("/api/export", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ rows }) });
    if (!r.ok) throw new Error();
    const blob = await r.blob(); const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `visualcount-${new Date().toISOString().slice(0, 10)}.xlsx`; a.click();
  } catch (e) { msg("Export failed. Check that VisualCount is still running on your computer.", true); }
};
renderRows();
if (location.protocol === "file:") {
  msg("This page was opened as a file, so it can't count. Close it, double-click start-windows.bat (or start-mac.command), wait for \"Model ready\", then open http://localhost:8000", true);
}
</script>
</body>
</html>
